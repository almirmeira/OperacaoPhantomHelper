<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ff0044;stop-opacity:0.4"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="220" fill="url(#bg)" rx="8"/>
  <rect width="960" height="220" fill="url(#grid)" rx="8"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="220" fill="url(#redGrad)" rx="3"/>

  <!-- Top border line -->
  <line x1="20" y1="1" x2="960" y2="1" stroke="#30363d" stroke-width="1"/>
  <line x1="20" y1="219" x2="960" y2="219" stroke="#30363d" stroke-width="1"/>

  <!-- Ghost/Phantom mask icon -->
  <g transform="translate(28,30)" filter="url(#glow)">
    <!-- Mask shape -->
    <ellipse cx="55" cy="55" rx="50" ry="55" fill="#1a0505" stroke="#ff4444" stroke-width="2"/>
    <!-- Left eye hole -->
    <ellipse cx="37" cy="52" rx="13" ry="16" fill="#0d1117"/>
    <ellipse cx="37" cy="52" rx="9" ry="11" fill="#ff4444" opacity="0.15"/>
    <!-- Right eye hole -->
    <ellipse cx="73" cy="52" rx="13" ry="16" fill="#0d1117"/>
    <ellipse cx="73" cy="52" rx="9" ry="11" fill="#ff4444" opacity="0.15"/>
    <!-- Eye glows -->
    <circle cx="37" cy="52" r="4" fill="#ff4444" opacity="0.6"/>
    <circle cx="73" cy="52" r="4" fill="#ff4444" opacity="0.6"/>
    <!-- Mask bottom cut -->
    <rect x="5" y="90" width="100" height="25" fill="#0d1117"/>
    <!-- Bottom wavy edge -->
    <path d="M 5 90 Q 18 100 30 90 Q 42 80 55 90 Q 68 100 80 90 Q 92 80 105 90 L 105 95 Q 92 85 80 95 Q 68 105 55 95 Q 42 85 30 95 Q 18 105 5 95 Z" fill="#ff4444" opacity="0.3"/>
    <!-- Question mark hint - phantom hint -->
    <text x="55" y="85" font-family="monospace" font-size="14" fill="#ff4444" text-anchor="middle" opacity="0.6">?</text>
  </g>

  <!-- Main Title -->
  <text x="165" y="65" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#e6edf3" filter="url(#glow)">OPERAÇÃO PHANTOM HELPER</text>

  <!-- Subtitle -->
  <text x="165" y="95" font-family="Courier New, monospace" font-size="15" fill="#00ff88">Quando a IA do Help Desk Vira Arma</text>

  <!-- Event line -->
  <line x1="165" y1="107" x2="700" y2="107" stroke="#30363d" stroke-width="1"/>
  <text x="165" y="123" font-family="Courier New, monospace" font-size="11" fill="#8b949e">Milvus Summit 2026  |  19 de Agosto  |  Sao Paulo, SP  |  50min Palestra Tecnica</text>

  <!-- Tags row 1 -->
  <rect x="165" y="135" width="105" height="20" rx="10" fill="#ff444422" stroke="#ff4444" stroke-width="1"/>
  <text x="217" y="149" font-family="Courier New, monospace" font-size="10" fill="#ff4444" text-anchor="middle">Prompt Injection</text>

  <rect x="278" y="135" width="115" height="20" rx="10" fill="#ff880022" stroke="#ff8800" stroke-width="1"/>
  <text x="335" y="149" font-family="Courier New, monospace" font-size="10" fill="#ff8800" text-anchor="middle">OWASP LLM Top 10</text>

  <rect x="401" y="135" width="115" height="20" rx="10" fill="#4488ff22" stroke="#4488ff" stroke-width="1"/>
  <text x="458" y="149" font-family="Courier New, monospace" font-size="10" fill="#4488ff" text-anchor="middle">MITRE ATT&amp;CK v14</text>

  <rect x="524" y="135" width="90" height="20" rx="10" fill="#8844ff22" stroke="#8844ff" stroke-width="1"/>
  <text x="569" y="149" font-family="Courier New, monospace" font-size="10" fill="#8844ff" text-anchor="middle">Red Team Lab</text>

  <rect x="622" y="135" width="85" height="20" rx="10" fill="#00ff8822" stroke="#00ff88" stroke-width="1"/>
  <text x="664" y="149" font-family="Courier New, monospace" font-size="10" fill="#00ff88" text-anchor="middle">Proxmox VE 8</text>

  <!-- Tags row 2 -->
  <rect x="165" y="163" width="90" height="20" rx="10" fill="#ff444415" stroke="#ff4444" stroke-width="1"/>
  <text x="210" y="177" font-family="Courier New, monospace" font-size="10" fill="#cc3333" text-anchor="middle">LLM01 LLM08</text>

  <rect x="263" y="163" width="85" height="20" rx="10" fill="#ff880015" stroke="#ff8800" stroke-width="1"/>
  <text x="305" y="177" font-family="Courier New, monospace" font-size="10" fill="#cc6600" text-anchor="middle">Llama 3  8B</text>

  <rect x="356" y="163" width="100" height="20" rx="10" fill="#ffffff10" stroke="#444" stroke-width="1"/>
  <text x="406" y="177" font-family="Courier New, monospace" font-size="10" fill="#8b949e" text-anchor="middle">FastAPI + Ollama</text>

  <rect x="464" y="163" width="75" height="20" rx="10" fill="#ffffff10" stroke="#444" stroke-width="1"/>
  <text x="501" y="177" font-family="Courier New, monospace" font-size="10" fill="#8b949e" text-anchor="middle">Kali Linux</text>

  <rect x="547" y="163" width="95" height="20" rx="10" fill="#00ff8810" stroke="#00aa55" stroke-width="1"/>
  <text x="594" y="177" font-family="Courier New, monospace" font-size="10" fill="#00aa55" text-anchor="middle">NIST SP 800-61</text>

  <!-- Right side: terminal decoration -->
  <rect x="760" y="20" width="185" height="185" rx="5" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="760" y="20" width="185" height="18" rx="5" fill="#21262d"/>
  <circle cx="773" cy="29" r="4" fill="#ff5f57"/>
  <circle cx="786" cy="29" r="4" fill="#febc2e"/>
  <circle cx="799" cy="29" r="4" fill="#28c840"/>
  <text x="860" y="33" font-family="Courier New, monospace" font-size="9" fill="#555" text-anchor="middle">aria-shell</text>

  <!-- Terminal lines -->
  <text x="770" y="55" font-family="Courier New, monospace" font-size="9" fill="#00ff88">$ whoami</text>
  <text x="770" y="70" font-family="Courier New, monospace" font-size="9" fill="#e6edf3">phantom</text>
  <text x="770" y="88" font-family="Courier New, monospace" font-size="9" fill="#00ff88">$ target?</text>
  <text x="770" y="103" font-family="Courier New, monospace" font-size="9" fill="#e6edf3">ARIA helpdesk IA</text>
  <text x="770" y="121" font-family="Courier New, monospace" font-size="9" fill="#00ff88">$ technique?</text>
  <text x="770" y="136" font-family="Courier New, monospace" font-size="9" fill="#ff4444">Prompt Injection</text>
  <text x="770" y="154" font-family="Courier New, monospace" font-size="9" fill="#00ff88">$ impact?</text>
  <text x="770" y="169" font-family="Courier New, monospace" font-size="9" fill="#ff4444">R$ 4.080.000</text>
  <text x="770" y="187" font-family="Courier New, monospace" font-size="9" fill="#00ff88">$ _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>

  <!-- Bottom author line -->
  <text x="165" y="205" font-family="Courier New, monospace" font-size="9" fill="#444">Almir Meira Alves  |  Meira e Sousa Ltda  |  Educa com Talento  |  linkedin.com/in/almirmeira</text>
</svg>
