  <text x="790" y="194" font-family="Courier New, monospace" font-size="7" fill="#cc0000" text-anchor="middle">Backdoor</text>
  <text x="790" y="203" font-family="Courier New, monospace" font-size="7" fill="#cc0000" text-anchor="middle">svc.phantom</text>

  <!-- Legend -->
  <rect x="100" y="500" width="760" height="45" rx="5" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <text x="480" y="516" font-family="Courier New, monospace" font-size="9" fill="#e6edf3" text-anchor="middle" font-weight="bold">LEGENDA DOS RISCOS</text>
  <circle cx="115" cy="533" r="6" fill="#ffaa0044" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="124" y="537" font-family="Courier New, monospace" font-size="8" fill="#ccc">R1: Endpoint sem auth (VUL-004)</text>
