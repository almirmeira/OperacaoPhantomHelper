  <!-- cols: improvavel 100-253, possivel 254-407, provavel 408-561, quase certo 562-715, certo 716-865 -->

  <!-- Row 5 (CATASTROFICO) -->
  <rect x="100" y="60" width="153" height="84" rx="2" fill="#ffaa0008" stroke="#553300" stroke-width="0.5"/>
  <rect x="254" y="60" width="153" height="84" rx="2" fill="#ff880015" stroke="#664400" stroke-width="0.5"/>
  <rect x="408" y="60" width="153" height="84" rx="2" fill="#ff440020" stroke="#882200" stroke-width="0.5"/>
