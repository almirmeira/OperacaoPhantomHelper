  <!-- 08:31 = 65 + (17/60)*150 = 65 + 42.5 ≈ 108  each hour = 150px -->
  <!-- 15:23 = 65 + (7*60+23)/60 * 150 = 65 + 443.75*150/60... let me simplify -->
  <!-- Scale: 08:14 to 16:00 = 466 min = 1100px => 1min = 2.36px -->
  <!-- 08:14 = x:65, 08:31 = 65+17*2.36=65+40=105, 15:23=65+(7*60+9)*2.36=65+1029=1094 -->
  <!-- 15:23 from 08:14 = 429min * 2.36 = 1012+65=1077  -->
  <rect x="105" y="80" width="972" height="120" rx="3" fill="#ff444408" stroke="#ff4444" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="590" y="73" font-family="Courier New, monospace" font-size="10" fill="#ff4444" text-anchor="middle" opacity="0.6">6h 52min — Phantom operou livremente sem deteccao</text>

  <!-- ATTACK EVENTS (above the line) -->

  <!-- 08:31 Ticket #47291 -->
